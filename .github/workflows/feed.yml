name: live feed

on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/feed.py", ".github/workflows/feed.yml"]

permissions:
  contents: write

concurrency:
  group: live-feed
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render feed
        run: python .github/scripts/feed.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FEED_SKIP: ${{ vars.FEED_SKIP }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/feed.svg
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update live feed"
            git push
          fi
